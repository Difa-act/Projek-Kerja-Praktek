<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMAN 1 Kota Tangerang Selatan - Dashboard Analitik</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- DataTables -->
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="side_menu.css">
</head>
<body>
    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="fas fa-sign-in-alt"></i> Login Sistem</h5>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-login"></i> Masuk
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="d-none">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
            <div class="container-fluid">
                <!-- Tombol Sidebar -->
                <a class="navbar-brand fw-bold" href="#">
                    <i class="fas fa-chart-line"></i> SMAN 1 Kota Tangerang Selatan Dashboard
                </a>

                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="userInfo">
                        <i class="fas fa-user"></i> Admin
                    </span>

                    <button class="btn btn-outline-light" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>

            </div>
        </nav>

        <div class="container-fluid py-4">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#" onclick="showDashboard()"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="breadcrumb-item active" id="currentPage" aria-current="page">Dashboard Utama</li>
                </ol>
            </nav>

            <!-- Dashboard Utama -->
            <div id="dashboardMain" class="row mb-4">
                <!-- Stat Cards -->
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-primary shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                        Total Siswa
                                    </div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800" id="totalStudents">1,250</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-users fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- More stat cards... -->
            </div>

            <!-- Content Area -->
            <div id="contentArea">
                <!-- Dashboard content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script_auth.js"></script>
    <script src="script_dashboard.js"></script>
    <script src="script_tasks.js"></script>
    <script src="script_charts.js"></script>
    <script src="side_menu_inject.js"></script>
</body>
</html>
